# 后端服务配置
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pharma-erp

  # 本地敏感配置（数据库口令等）不入库：从 config/local-dev.yml 读取，模板见 config/local-dev.yml.example
  config:
    import: optional:file:./config/local-dev.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pharma_erp}
    username: ${DB_USER:postgres}
    # 口令不入库：本地写在 config/local-dev.yml，部署用 DB_PASSWORD 注入
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # 导入文件上限由业务代码校验（≤5MB）；容器放宽到 10MB 以便返回 400 而不是容器异常
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate   # 表结构由 Flyway 管理，JPA 只做校验（不自动改表）
    open-in-view: false
    # SQL 日志默认关闭（生产静默），本地调试用 SHOW_SQL=true / SHOW_SQL_FORMAT=true 打开
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SHOW_SQL_FORMAT:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis：仅用于 JWT jti 单 token 黑名单（批次十一）。
  # 注意：Redis 不可用时不阻断启动与登录请求，黑名单校验自动降级为放行（见 TokenBlacklistService）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms
      # 本项目只用 RedisTemplate，不启用 Spring Data Redis Repository（避免启动扫描 JPA 仓库刷日志）
      repositories:
        enabled: false

# JWT 配置
app:
  jwt:
    # 生产必须通过环境变量 JWT_SECRET 注入；下面的默认值仅供本地开发，禁止用于生产（P1-24）
    secret: ${JWT_SECRET:pharma-erp-dev-only-jwt-secret-change-in-prod-0123456789}
    expiration: ${JWT_EXPIRATION:7200000}   # 2 小时（毫秒），配合 refresh 续期

  # 跨域允许来源（逗号分隔，支持通配符模式）。dev 默认本地前端；
  # 内网穿透演示域名（cpolar 隧道，浏览器 POST 请求携带 Origin 头会被 CORS 过滤器校验）；
  # 生产用 CORS_ALLOWED_ORIGINS 注入真实域名
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.cpolar.top,http://*.cpolar.top,https://*.cpolar.cn,http://*.cpolar.cn}

  # 单据业务日期校验（P2-6）：允许回填的最大天数，超过则 400
  biz-date:
    max-back-days: ${BIZ_DATE_MAX_BACK_DAYS:365}
